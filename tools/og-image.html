<!DOCTYPE html>
<!-- Source for /og-image.jpg (1200x1200 share image). Regenerate with: npm run og-image -->
<html lang="en-US">
<head>
<meta charset="UTF-8">
<style>
@font-face{font-family:"Montserrat";font-weight:300 700;src:url(../fonts/montserrat-latin.woff2) format("woff2");}
@font-face{font-family:"Cormorant Garamond";font-weight:300 600;src:url(../fonts/cormorant-garamond-latin.woff2) format("woff2");}
@font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:300 400;src:url(../fonts/cormorant-garamond-italic-latin.woff2) format("woff2");}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1200px;height:1200px;}
body{background:#16213e;color:#faf9f7;font-family:"Montserrat",sans-serif;position:relative;overflow:hidden;}
.bg{position:absolute;inset:0;background:url(../images/digital-marketing-team-laptops-w1800.webp) center/cover;opacity:0.16;}
.frame{position:absolute;inset:48px;border:2px solid rgba(232,82,26,0.35);}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 110px;}
.logo{display:flex;align-items:center;gap:22px;font-weight:600;font-size:58px;letter-spacing:-1px;}
.logo i{display:block;width:9px;height:76px;border-radius:4px;background:#e8521a;}
.rule{width:120px;height:3px;background:#e8521a;margin:56px auto;}
h1{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:104px;line-height:1.04;}
h1 em{font-style:italic;color:#f07340;}
.services{margin-top:52px;font-size:32px;font-weight:500;letter-spacing:0.04em;color:rgba(250,249,247,0.9);line-height:1.6;}
.where{margin-top:48px;font-size:28px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;color:#f07340;}
.url{position:absolute;bottom:96px;left:0;right:0;text-align:center;font-size:30px;letter-spacing:0.12em;color:rgba(250,249,247,0.75);}
</style>
</head>
<body>
<div class="bg"></div>
<div class="frame"></div>
<div class="wrap">
  <div class="logo"><i></i>smart kteam</div>
  <div class="rule"></div>
  <h1>Digital Growth for <em>Small Businesses</em></h1>
  <div class="services">Websites · Local SEO · Google Ads<br>Booking &amp; Payments · Insurance Claims</div>
  <div class="where">Seattle-based · US &amp; Canada</div>
</div>
<div class="url">smartkteam.com</div>
</body>
</html>
